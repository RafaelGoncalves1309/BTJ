<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>DIP 2026 - Fé Corajosa</title>

        <link rel="stylesheet" href="btj.css">

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap');
        </style>
        
    </head>

    <body>

        <div class="overlay"></div>

        <div class="container">

            <h1>DIP 2026</h1>
            <h2>Fé Corajosa</h2>

            <h2>Conheça nossas redes sociais</h2>
            <a class="botao instagram"
                href="https://www.instagram.com/btjbrasil/"
                target="_blank" rel="noopener noreferrer">
                <img src="instagram.png" class="icone">
                BTJ - Back to Jerusalem
            </a>

            <a class="botao instagram"
            href="https://www.instagram.com/portasabertasbrasil/"
            target="_blank" rel="noopener noreferrer">

            <img src="instagram.png" class="icone">

                Portas Abertas Brasil
            </a>

            <div class="downloads">

                <h2>Baixe nossos materiais</h2>

                <a class="botao pdf"
                href="back-to-jerusalem.pdf"
                download
                onclick="setTimeout(() => contarDownload('back-to-jerusalem'), 100)">

                    <img src="pdf.png" class="icone">
                    <span>Back to Jerusalem</span>

                </a>

                <a class="botao pdf"
                href="btj-newsletter-2026.pdf"
                download
                onclick="setTimeout(() => contarDownload('newsletter-2026'), 100)">

                    <img src="pdf.png" class="icone">
                    <span>BTJ - Newsletter - 2026</span>

                </a>

                <a class="botao pdf"
                href="portas-abertas-revista-maio2026.pdf"
                download
                onclick="setTimeout(() => contarDownload('portas-abertas-maio-2026'), 100)">

                    <img src="pdf.png" class="icone">
                    <span>Portas Abertas - Revista - Maio 2026</span>

                </a>

            </div>
        </div>
        
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
        <script src="script.js"></script>

    </body>

</html>
